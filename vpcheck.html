<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>视口自检</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC",sans-serif; background:#D7F0FF; padding:20px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size:18px; color:#2F6FB5; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed #E5EEF7; font-size:15px; }
  .row:last-child { border-bottom:none; }
  .k { color:#5A7184; }
  .v { font-weight:700; color:#1D3A52; word-break:break-all; text-align:right; max-width:60%; }
  .big { font-size:34px; font-weight:800; color:#E4572E; text-align:center; padding:6px 0; }
  .tip { font-size:13px; color:#5A7184; line-height:1.8; }
  .bad { color:#CF1322; font-weight:700; }
  .ok { color:#2E7D42; font-weight:700; }
</style>
</head>
<body>
<div class="card">
  <h1>📐 视口自检（红妹妹专用）</h1>
  <div class="big" id="vpw">—</div>
  <div class="row"><span class="k">window.innerWidth</span><span class="v" id="iw">—</span></div>
  <div class="row"><span class="k">window.innerHeight</span><span class="v" id="ih">—</span></div>
  <div class="row"><span class="k">screen.width × height</span><span class="v" id="scr">—</span></div>
  <div class="row"><span class="k">devicePixelRatio</span><span class="v" id="dpr">—</span></div>
  <div class="row"><span class="k">visualViewport.width</span><span class="v" id="vv">—</span></div>
  <div class="row"><span class="k">visualViewport.scale</span><span class="v" id="vs">—</span></div>
  <div class="row"><span class="k">document.clientW</span><span class="v" id="cw">—</span></div>
  <div class="row"><span class="k">横向滚动溢出</span><span class="v" id="ovf">—</span></div>
  <div class="row"><span class="k">display-mode</span><span class="v" id="dm">—</span></div>
  <div class="row"><span class="k">touch 点数</span><span class="v" id="tc">—</span></div>
</div>
<div class="card">
  <h1>📱 环境（长按可全选复制）</h1>
  <div class="row"><span class="v" style="max-width:100%;text-align:left;font-weight:400;font-size:13px;" id="ua">—</span></div>
</div>
<div class="card">
  <p class="tip">把这个页面在<b>出问题的那个打开方式</b>里打开，截图发给红妹妹。数字会告诉我：页面当时按多宽渲染、有没有被浏览器缩小或放大。</p>
</div>
<script>
function fill() {
  var vv = window.visualViewport || {};
  var iw = window.innerWidth, ih = window.innerHeight;
  document.getElementById('vpw').textContent = iw + ' pt 宽';
  document.getElementById('iw').textContent = iw;
  document.getElementById('ih').textContent = ih;
  document.getElementById('scr').textContent = screen.width + ' × ' + screen.height;
  document.getElementById('dpr').textContent = window.devicePixelRatio;
  document.getElementById('vv').textContent = vv.width != null ? Math.round(vv.width * 10) / 10 : '不支持';
  document.getElementById('vs').textContent = vv.scale != null ? Math.round(vv.scale * 100) / 100 : '不支持';
  var de = document.documentElement;
  document.getElementById('cw').textContent = de.clientWidth;
  var ovf = de.scrollWidth - de.clientWidth;
  var el = document.getElementById('ovf');
  el.textContent = ovf > 0 ? ('+' + ovf + ' px（有溢出）') : '无';
  el.className = 'v ' + (ovf > 0 ? 'bad' : 'ok');
  var dm = 'browser';
  try { if (window.matchMedia('(display-mode: standalone)').matches) dm = 'standalone（桌面图标）'; } catch(e) {}
  document.getElementById('dm').textContent = dm;
  document.getElementById('tc').textContent = navigator.maxTouchPoints;
  document.getElementById('ua').textContent = navigator.userAgent;
}
fill();
window.addEventListener('resize', fill);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fill);
</script>
</body>
</html>
